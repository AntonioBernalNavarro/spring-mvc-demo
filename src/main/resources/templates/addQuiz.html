<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir pregunta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container container--narrow">

    <h1>Añadir nueva pregunta</h1>

    <form th:action="@{/addQuiz}" th:object="${question}" method="post">

        <div class="form-group">
            <label for="id">ID</label>
            <input type="number" id="id" th:field="*{id}" required>
        </div>

        <div class="form-group">
            <label for="questionText">Pregunta</label>
            <input type="text" id="questionText" th:field="*{questionText}" required>
        </div>

        <div class="form-group">
            <label for="options">Opciones <small>(una por línea)</small></label>
            <textarea id="options" name="optionsRaw" rows="4" required></textarea>
        </div>

        <div class="form-group">
            <label for="correctAnswer">Respuesta correcta</label>
            <input type="text" id="correctAnswer" th:field="*{correctAnswer}" required>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn--primary">Guardar</button>
            <a th:href="@{/quizList}" class="btn btn--secondary">Cancelar</a>
        </div>

    </form>

</div>

</body>
</html>
