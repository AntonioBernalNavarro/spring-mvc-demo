<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar pregunta</title>
</head>
<body>
<h2>Editar pregunta</h2>

<form id="editForm">
    <div>
        <label for="id">ID:</label>
        <input type="number" id="id" name="id" th:value="${question.id}" readonly/>
    </div>
    <div>
        <label for="questionText">Pregunta:</label>
        <input type="text" id="questionText" name="questionText" th:value="${question.questionText}" required/>
    </div>
    <div>
        <label>Opciones (separadas por comas):</label><br/>
        <textarea id="options" name="options" rows="4" required
                  th:text="${#strings.listJoin(question.options, ',')}"></textarea>
    </div>
    <div>
        <label for="correctAnswer">Respuesta correcta:</label>
        <input type="text" id="correctAnswer" name="correctAnswer"
               th:value="${question.correctAnswer}" required/>
    </div>
    <button type="button" onclick="updateQuiz()">Actualizar</button>
</form>

<p><a th:href="@{/quizList}">← Volver a la lista</a></p>

<script th:inline="javascript">
    function updateQuiz() {
        const id = document.getElementById('id').value;
        const questionText = document.getElementById('questionText').value;
        const optionsRaw = document.getElementById('options').value;
        const correctAnswer = document.getElementById('correctAnswer').value;

        const options = optionsRaw.split(',').map(s => s.trim());

        const payload = {
            id: parseInt(id),
            questionText: questionText,
            options: options,
            correctAnswer: correctAnswer
        };

        fetch('/editQuiz', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => window.location.href = '/quizList');
    }
</script>
</body>
</html>
