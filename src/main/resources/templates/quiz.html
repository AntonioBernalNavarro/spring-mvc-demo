<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container">

    <div class="page-header">
        <div>
            <h1>Cuestionario</h1>
            <p>Usuario: <strong th:text="${username}">invitado</strong></p>
        </div>
        <div class="actions">
            <a th:href="@{/logout}" class="btn btn--secondary">Cerrar sesión</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(questions)}" class="alert alert--error">
        No hay preguntas disponibles en este momento.
    </div>

    <form th:unless="${#lists.isEmpty(questions)}"
          th:action="@{/submitAnswers}"
          method="post">

        <div th:each="q, iter : ${questions}" class="question">

            <div class="question__text">
                <span th:text="${iter.index + 1} + '. '"></span>
                <span th:text="${q.questionText}"></span>
            </div>

            <div class="question__options">
                <label th:each="opt : ${q.options}">
                    <input type="radio"
                           th:name="'answer_' + ${q.id}"
                           th:value="${opt}"
                           required>
                    <span th:text="${opt}"></span>
                </label>
            </div>

        </div>

        <div class="actions">
            <button type="submit" class="btn btn--primary">Enviar respuestas</button>
        </div>

    </form>

</div>

</body>
</html>
