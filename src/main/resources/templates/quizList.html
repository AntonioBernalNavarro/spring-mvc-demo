<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de cuestionarios</title>
</head>
<body>
<h2>Gestión de preguntas (Admin)</h2>

<p><a th:href="@{/addQuiz}">➕ Añadir nueva pregunta</a></p>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>ID</th>
        <th>Pregunta</th>
        <th>Opciones</th>
        <th>Respuesta correcta</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="q : ${questions}">
        <td th:text="${q.id}"></td>
        <td th:text="${q.questionText}"></td>
        <td th:text="${q.options}"></td>
        <td th:text="${q.correctAnswer}"></td>
        <td>
            <a th:href="@{/editQuiz/{id}(id=${q.id})}">✏️ Editar</a>
            |
            <a href="#" th:onclick="'deleteQuiz(' + ${q.id} + ')'">🗑️ Eliminar</a>
        </td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/logout}">Cerrar sesión</a></p>

<script th:inline="javascript">
    function deleteQuiz(id) {
        if (!confirm('¿Seguro que quieres eliminar esta pregunta?')) return;
        fetch('/deleteQuiz/' + id, { method: 'DELETE' })
            .then(() => location.reload());
    }
</script>
</body>
</html>
